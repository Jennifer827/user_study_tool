# version: "3"
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend/public
    environment:
      - FLASK_ENV=development
    networks:
      - app_network
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - app_network
    environment:
      # Create React Appのホットリロードに必要な場合
      # - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development

networks:
  app_network: # ここで明示的にネットワークを定義
    driver: bridge
